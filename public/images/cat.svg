<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pastelSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="40%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="catFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="trenchCoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a88258"/>
      <stop offset="50%" stop-color="#785c3b"/>
      <stop offset="100%" stop-color="#543e26"/>
    </linearGradient>
  </defs>

  <!-- Pastel Victorian Street Sky -->
  <rect width="400" height="600" fill="url(#pastelSky)"/>

  <!-- Victorian Pastel Houses in Background -->
  <!-- House 1: Purple -->
  <rect x="10" y="100" width="110" height="320" fill="#c084fc"/>
  <polygon points="10,100 65,40 120,100" fill="#7e22ce"/>
  <!-- Windows -->
  <rect x="30" y="120" width="28" height="40" rx="14" fill="#fef08a" stroke="#581c87" stroke-width="2"/>
  <rect x="70" y="120" width="28" height="40" rx="14" fill="#fef08a" stroke="#581c87" stroke-width="2"/>
  <rect x="30" y="180" width="28" height="40" rx="14" fill="#fef08a" stroke="#581c87" stroke-width="2"/>
  <rect x="70" y="180" width="28" height="40" rx="14" fill="#fef08a" stroke="#581c87" stroke-width="2"/>

  <!-- House 2: Teal -->
  <rect x="125" y="130" width="120" height="290" fill="#2dd4bf"/>
  <polygon points="125,130 185,70 245,130" fill="#0f766e"/>
  <!-- Windows -->
  <rect x="145" y="150" width="32" height="42" fill="#fff" stroke="#115e59" stroke-width="2"/>
  <rect x="190" y="150" width="32" height="42" fill="#fff" stroke="#115e59" stroke-width="2"/>

  <!-- House 3: Rose / Coral -->
  <rect x="250" y="110" width="140" height="310" fill="#fda4af"/>
  <polygon points="250,110 320,50 390,110" fill="#be123c"/>
  <!-- Windows -->
  <rect x="275" y="130" width="30" height="42" fill="#fef08a" stroke="#9f1239" stroke-width="2"/>
  <rect x="330" y="130" width="30" height="42" fill="#fef08a" stroke="#9f1239" stroke-width="2"/>

  <!-- Vintage Yellow Cable Car / Trolley in background right -->
  <rect x="280" y="270" width="110" height="150" rx="10" fill="#eab308" stroke="#854d0e" stroke-width="3"/>
  <rect x="280" y="270" width="110" height="35" fill="#a16207"/>
  <rect x="290" y="320" width="25" height="45" fill="#93c5fd" stroke="#713f12" stroke-width="1.5"/>
  <rect x="325" y="320" width="25" height="45" fill="#93c5fd" stroke="#713f12" stroke-width="1.5"/>
  <rect x="360" y="320" width="25" height="45" fill="#93c5fd" stroke="#713f12" stroke-width="1.5"/>
  <text x="300" y="295" font-size="12" font-weight="bold" fill="#fff">CABLE CAR</text>

  <!-- Cobblestone Street -->
  <rect x="0" y="420" width="400" height="180" fill="#64748b"/>
  <g fill="#475569" opacity="0.4">
    <ellipse cx="60" cy="450" rx="18" ry="8"/>
    <ellipse cx="120" cy="460" rx="22" ry="9"/>
    <ellipse cx="200" cy="450" rx="19" ry="8"/>
    <ellipse cx="270" cy="465" rx="24" ry="10"/>
    <ellipse cx="350" cy="455" rx="20" ry="9"/>
    <ellipse cx="80" cy="510" rx="25" ry="10"/>
    <ellipse cx="160" cy="520" rx="22" ry="9"/>
    <ellipse cx="240" cy="510" rx="26" ry="10"/>
    <ellipse cx="320" cy="525" rx="24" ry="10"/>
  </g>

  <!-- Cat Detective in Foreground (Center-Left) -->
  <!-- Trenchcoat Body -->
  <path d="M70 420 Q160 380 230 420 L250 600 L50 600 Z" fill="url(#trenchCoat)"/>
  <!-- Lapels and Collar -->
  <path d="M120 400 L160 490 L110 540 Z" fill="#60472e"/>
  <path d="M180 400 L140 490 L190 540 Z" fill="#60472e"/>
  <circle cx="150" cy="510" r="5" fill="#2d1f11"/>
  <circle cx="150" cy="545" r="5" fill="#2d1f11"/>

  <!-- Cat Head -->
  <ellipse cx="150" cy="330" rx="65" ry="60" fill="url(#catFur)"/>
  
  <!-- Cat Ears -->
  <polygon points="90,280 110,210 140,275" fill="#ea580c"/>
  <polygon points="98,275 112,225 132,270" fill="#fda4af"/>
  <polygon points="210,280 190,210 160,275" fill="#ea580c"/>
  <polygon points="202,275 188,225 168,270" fill="#fda4af"/>

  <!-- Fedora / Bowler Hat -->
  <ellipse cx="150" cy="260" rx="75" ry="20" fill="#785c3b" stroke="#45311c" stroke-width="2"/>
  <path d="M100 255 C100 180 200 180 200 255 Z" fill="#8c6d48" stroke="#45311c" stroke-width="2"/>
  <rect x="100" y="242" width="100" height="12" fill="#1c1917"/>

  <!-- Cat Eyes (Large, expressive anime/pixar style) -->
  <ellipse cx="125" cy="330" rx="16" ry="18" fill="#15803d"/>
  <ellipse cx="125" cy="330" rx="14" ry="16" fill="#22c55e"/>
  <circle cx="125" cy="330" r="9" fill="#052e16"/>
  <circle cx="122" cy="324" r="4" fill="#ffffff"/>

  <ellipse cx="175" cy="330" rx="16" ry="18" fill="#15803d"/>
  <ellipse cx="175" cy="330" rx="14" ry="16" fill="#22c55e"/>
  <circle cx="175" cy="330" r="9" fill="#052e16"/>
  <circle cx="172" cy="324" r="4" fill="#ffffff"/>

  <!-- Cat Muzzle & Pink Nose -->
  <ellipse cx="143" cy="355" rx="14" ry="10" fill="#ffedd5"/>
  <ellipse cx="157" cy="355" rx="14" ry="10" fill="#ffedd5"/>
  <polygon points="146,346 154,346 150,352" fill="#f43f5e"/>
  <path d="M150 352 L150 358 M144 358 Q150 363 156 358" stroke="#78350f" stroke-width="2" fill="none"/>

  <!-- Whiskers -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.8">
    <line x1="130" y1="355" x2="80" y2="345"/>
    <line x1="130" y1="360" x2="80" y2="365"/>
    <line x1="170" y1="355" x2="220" y2="345"/>
    <line x1="170" y1="360" x2="220" y2="365"/>
  </g>
</svg>
