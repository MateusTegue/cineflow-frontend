<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <radialGradient id="owlBg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#2a3342"/>
      <stop offset="60%" stop-color="#12161f"/>
      <stop offset="100%" stop-color="#07090e"/>
    </radialGradient>
    <radialGradient id="eyeLeft" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fff7a1"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="90%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <radialGradient id="eyeRight" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fff7a1"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="90%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#owlBg)" />

  <!-- Feathers texture body -->
  <ellipse cx="200" cy="480" rx="190" ry="240" fill="#1e293b" opacity="0.8"/>
  <ellipse cx="200" cy="380" rx="160" ry="180" fill="url(#featherGrad)" opacity="0.95"/>

  <!-- Face disc -->
  <ellipse cx="140" cy="260" rx="85" ry="95" fill="#f8fafc" opacity="0.95"/>
  <ellipse cx="260" cy="260" rx="85" ry="95" fill="#f8fafc" opacity="0.95"/>
  <ellipse cx="140" cy="260" rx="70" ry="80" fill="#e2e8f0" opacity="0.8"/>
  <ellipse cx="260" cy="260" rx="70" ry="80" fill="#e2e8f0" opacity="0.8"/>

  <!-- Feather patterns & radiating strokes -->
  <g stroke="#94a3b8" stroke-width="1.5" opacity="0.6">
    <path d="M140 260 L80 200 M140 260 L70 240 M140 260 L70 280 M140 260 L90 320"/>
    <path d="M260 260 L320 200 M260 260 L330 240 M260 260 L330 280 M260 260 L310 320"/>
    <path d="M200 200 L180 140 M200 200 L220 140 M200 200 L200 130"/>
  </g>

  <!-- Eyes Glow -->
  <circle cx="145" cy="255" r="32" fill="#f59e0b" opacity="0.3" filter="url(#glow)"/>
  <circle cx="255" cy="255" r="32" fill="#f59e0b" opacity="0.3" filter="url(#glow)"/>

  <!-- Eyes -->
  <circle cx="145" cy="255" r="28" fill="url(#eyeLeft)" stroke="#0f172a" stroke-width="3"/>
  <circle cx="255" cy="255" r="28" fill="url(#eyeRight)" stroke="#0f172a" stroke-width="3"/>

  <!-- Pupils -->
  <ellipse cx="145" cy="255" rx="14" ry="16" fill="#09090b" />
  <ellipse cx="255" cy="255" rx="14" ry="16" fill="#09090b" />

  <!-- Catchlights in eyes -->
  <circle cx="138" cy="248" r="5" fill="#ffffff" opacity="0.9" />
  <circle cx="248" cy="248" r="5" fill="#ffffff" opacity="0.9" />
  <circle cx="152" cy="262" r="2.5" fill="#ffffff" opacity="0.7" />
  <circle cx="262" cy="262" r="2.5" fill="#ffffff" opacity="0.7" />

  <!-- Brow ridges -->
  <path d="M90 220 Q145 235 195 245" stroke="#334155" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M310 220 Q255 235 205 245" stroke="#334155" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M95 218 Q145 230 195 240" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M305 218 Q255 230 205 240" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Beak -->
  <path d="M192 245 Q200 240 208 245 L204 315 Q200 320 196 315 Z" fill="#1e293b" />
  <path d="M196 245 L196 310" stroke="#475569" stroke-width="2" />
  <path d="M198 248 L202 305" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Ambient dark vignette -->
  <rect width="400" height="600" fill="none" stroke="#000000" stroke-width="40" opacity="0.4" />
</svg>
