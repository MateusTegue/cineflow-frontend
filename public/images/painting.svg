<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <radialGradient id="canvasBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="60%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="petalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fb923c"/>
      <stop offset="80%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="petalGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fed7aa"/>
      <stop offset="70%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="70%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>

  <!-- Textured Oil Canvas Blue Background -->
  <rect width="400" height="600" fill="url(#canvasBg)"/>

  <!-- Canvas texture brushstrokes -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="8" stroke-linecap="round">
    <line x1="20" y1="50" x2="120" y2="80"/>
    <line x1="280" y1="40" x2="380" y2="70"/>
    <line x1="30" y1="450" x2="150" y2="480"/>
    <line x1="250" y1="480" x2="370" y2="520"/>
  </g>

  <!-- Green Stems & Leaves -->
  <path d="M160 380 Q180 480 190 580" stroke="url(#stemGrad)" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M260 360 Q240 460 210 580" stroke="url(#stemGrad)" stroke-width="12" stroke-linecap="round" fill="none"/>
  
  <!-- Big Leaf Left -->
  <path d="M170 440 Q100 420 80 470 Q140 480 175 460 Z" fill="#16a34a" opacity="0.9"/>
  <!-- Leaf Right -->
  <path d="M240 450 Q310 430 330 480 Q270 490 235 470 Z" fill="#15803d" opacity="0.9"/>

  <!-- Left Big Hibiscus Flower -->
  <g transform="translate(130, 240)">
    <!-- Petals -->
    <path d="M0 0 C-60 -90 -10 -120 0 -50 Z" fill="url(#petalGrad1)" transform="rotate(-60)"/>
    <path d="M0 0 C-60 -90 -10 -120 0 -50 Z" fill="url(#petalGrad2)" transform="rotate(0)"/>
    <path d="M0 0 C-60 -90 -10 -120 0 -50 Z" fill="url(#petalGrad1)" transform="rotate(60)"/>
    <path d="M0 0 C-60 -90 -10 -120 0 -50 Z" fill="url(#petalGrad2)" transform="rotate(120)"/>
    <path d="M0 0 C-60 -90 -10 -120 0 -50 Z" fill="url(#petalGrad1)" transform="rotate(180)"/>
    <path d="M0 0 C-60 -90 -10 -120 0 -50 Z" fill="url(#petalGrad2)" transform="rotate(240)"/>
    
    <!-- Flower Center & Stamen -->
    <circle cx="0" cy="0" r="16" fill="#991b1b"/>
    <path d="M0 0 Q10 -30 30 -50" stroke="#facc15" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="30" cy="-50" r="5" fill="#eab308"/>
    <circle cx="28" cy="-45" r="3" fill="#fef08a"/>
  </g>

  <!-- Right Tropical Hibiscus Flower -->
  <g transform="translate(260, 220)">
    <!-- Petals -->
    <path d="M0 0 C-50 -80 -10 -100 0 -40 Z" fill="url(#petalGrad2)" transform="rotate(-40)"/>
    <path d="M0 0 C-50 -80 -10 -100 0 -40 Z" fill="url(#petalGrad1)" transform="rotate(20)"/>
    <path d="M0 0 C-50 -80 -10 -100 0 -40 Z" fill="url(#petalGrad2)" transform="rotate(80)"/>
    <path d="M0 0 C-50 -80 -10 -100 0 -40 Z" fill="url(#petalGrad1)" transform="rotate(140)"/>
    <path d="M0 0 C-50 -80 -10 -100 0 -40 Z" fill="url(#petalGrad2)" transform="rotate(200)"/>
    <path d="M0 0 C-50 -80 -10 -100 0 -40 Z" fill="url(#petalGrad1)" transform="rotate(260)"/>
    
    <!-- Flower Center & Stamen -->
    <circle cx="0" cy="0" r="14" fill="#881337"/>
    <path d="M0 0 Q-10 -25 -25 -45" stroke="#facc15" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <circle cx="-25" cy="-45" r="4.5" fill="#eab308"/>
  </g>

  <!-- Expressive paint splatters & brush marks -->
  <g fill="#fde047" opacity="0.7">
    <circle cx="80" cy="180" r="3"/>
    <circle cx="330" cy="140" r="2.5"/>
    <circle cx="350" cy="300" r="3"/>
    <circle cx="60" cy="330" r="2"/>
  </g>
</svg>
